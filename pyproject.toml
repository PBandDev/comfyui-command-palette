[project]
name = "comfyui-command-palette"
description = "A command palette extension for ComfyUI"
version = "1.0.1"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }

[dependency-groups]
dev = [
  "bump-my-version>=1.2.2",
  "pytest>=8.4.2",
]

[project.urls]
Repository = "https://github.com/PBandDev/comfyui-command-palette"

[tool.comfy]
PublisherId = "PBandDev"
DisplayName = "ComfyUI Command Palette"
Icon = "https://raw.githubusercontent.com/PBandDev/comfyui-command-palette/main/assets/icon.svg"
requires-comfyui = ">=0.14.0"
includes = ['dist']

[tool.bumpversion]
current_version = "1.0.1"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = false
tag = false
tag_name = "v{new_version}"
tag_message = "Release version {new_version}"
message = "chore: bump version to {new_version} [skip ci]"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "package.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = "frontend/src/index.ts"
search = 'Version {current_version}'
replace = 'Version {new_version}'
